<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена — MOKKO CRM</title>
<meta name="robots" content="noindex">
<style>
    @font-face {
        font-family: 'Manrope';
        src: url('/mokko-crm.ru/fonts/manrope/manrope-cyrillic.woff2') format('woff2');
        font-weight: 400 800; font-display: swap;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
    }
    @font-face {
        font-family: 'Manrope';
        src: url('/mokko-crm.ru/fonts/manrope/manrope-latin.woff2') format('woff2');
        font-weight: 400 800; font-display: swap;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212, U+FEFF, U+FFFD;
    }
    :root {
        --bg: #0f0d0b;
        --surface: #181513;
        --border: #2d2722;
        --text: #f2ece4;
        --text-dim: #bdb2a6;
        --text-mute: #8c8175;
        --accent: #d9a46a;
        --accent-ink: #1e1309;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .card { animation: none !important; } }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 20px;
        background:
            radial-gradient(900px 640px at 0% 0%, rgba(217, 164, 106, .10), transparent 62%),
            var(--bg);
        color: var(--text);
        font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
    }
    .card {
        width: 100%;
        max-width: 460px;
        background: rgba(24, 21, 19, .86);
        animation: rise 720ms cubic-bezier(.16, 1, .3, 1) both;
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 40px 32px 32px;
        text-align: center;
        box-shadow: 0 20px 50px rgba(0, 0, 0, .45);
    }
    .mark { height: 28px; width: auto; display: block; margin: 0 auto 28px; }
    .code {
        font-size: 13px;
        font-weight: 600;
        color: var(--accent);
        margin-bottom: 8px;
    }
    h1 { font-size: 26px; font-weight: 700; letter-spacing: -.025em; line-height: 1.2; margin: 0 0 12px; }
    p { color: var(--text-dim); font-size: 14.5px; line-height: 1.6; margin: 0 0 24px; }
    .btn {
        display: block;
        width: 100%;
        padding: 13px 18px;
        border-radius: 12px;
        background: var(--accent);
        color: var(--accent-ink);
        font-weight: 600;
        font-size: 15px;
        text-decoration: none;
        transition: background-color .12s ease, transform .12s ease;
    }
    .btn:hover { background: #e8bf8f; }
    .btn:active { transform: scale(.97); }
    .foot { margin-top: 20px; color: var(--text-mute); font-size: 12px; }
    .foot a { color: var(--text-dim); text-decoration: none; }
    .foot a:hover { color: var(--accent); }
</style>
</head>
<body>
    <div class="card">
        <img class="mark" src="/mokko-crm.ru/images/brand/wordmark.svg?v=1" alt="MOKKO" width="160" height="33">
        <div class="code">Ошибка 404</div>
        <h1>Страница не найдена</h1>
        <p>Возможно, ссылка устарела или страница была перемещена. Вернитесь на страницу входа — там всё на месте.</p>
        <a class="btn" href="/mokko-crm.ru/login">Перейти к входу</a>
        <div class="foot"><a href="/mokko-crm.ru/subscribe">MOKKO CRM</a> — учёт для кофеен</div>
    </div>
</body>
</html>
